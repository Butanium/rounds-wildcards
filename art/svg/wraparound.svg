<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
<defs>
<clipPath id="in"><rect x="130" y="0" width="252" height="512"/></clipPath>
</defs>
<!-- screen frame -->
<rect x="130" y="110" width="252" height="292" rx="22" fill="none" stroke="#fff" stroke-width="18" stroke-opacity="0.5"/>
<!-- blob exiting right: inside half solid, outside half ghost -->
<circle cx="382" cy="256" r="62" fill="#fff" fill-opacity="0.4"/>
<circle cx="382" cy="256" r="62" fill="#fff" clip-path="url(#in)"/>
<!-- blob re-entering left -->
<circle cx="130" cy="256" r="62" fill="#fff" fill-opacity="0.4"/>
<circle cx="130" cy="256" r="62" fill="#fff" clip-path="url(#in)"/>
<!-- eyes -->
<circle cx="364" cy="240" r="9" fill="#5a2a7a"/>
<circle cx="150" cy="240" r="9" fill="#5a2a7a"/>
<!-- motion dashes between -->
<path d="M210 256 H302" stroke="#fff" stroke-width="18" stroke-linecap="round" stroke-dasharray="1 44"/>
<path d="M170 256 H340" stroke="#fff" stroke-width="16" stroke-linecap="round" stroke-dasharray="40 40" stroke-opacity="0"/>
</svg>
