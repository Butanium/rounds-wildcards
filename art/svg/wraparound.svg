<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="865" viewBox="0 0 1100 865">
<defs>
<pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="4" cy="4" r="2" fill="#000" opacity="0.13"/><circle cx="11" cy="11" r="1.4" fill="#000" opacity="0.1"/></pattern>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="blur2" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
<linearGradient id="gL" x1="0" x2="1"><stop offset="0" stop-color="#b070e8" stop-opacity="0.55"/><stop offset="1" stop-color="#b070e8" stop-opacity="0"/></linearGradient>
<linearGradient id="gR" x1="1" x2="0"><stop offset="0" stop-color="#b070e8" stop-opacity="0.55"/><stop offset="1" stop-color="#b070e8" stop-opacity="0"/></linearGradient>
<linearGradient id="trail" x1="0" x2="1"><stop offset="0" stop-color="#d9b6f5" stop-opacity="0"/><stop offset="1" stop-color="#d9b6f5" stop-opacity="0.8"/></linearGradient>
<g id="ball">
 <path d="M20 650 C0 740 25 800 -10 890" stroke="#7a3fb0" stroke-width="22" fill="none" stroke-linecap="round"/>
 <path d="M135 650 C160 740 140 800 175 890" stroke="#7a3fb0" stroke-width="22" fill="none" stroke-linecap="round"/>
 <path d="M-100 570 C-150 610 -150 660 -125 710" stroke="#7a3fb0" stroke-width="22" fill="none" stroke-linecap="round"/>
 <path d="M235 545 C285 565 330 545 344 500" stroke="#7a3fb0" stroke-width="22" fill="none" stroke-linecap="round"/>
 <circle cx="60" cy="500" r="190" fill="#7a3fb0"/>
 <circle cx="60" cy="500" r="190" fill="url(#dots)"/>
 <!-- sunglasses: one pair in ball space, split by the screen seam at x=0 -->
 <path d="M-135 438 L250 438 L252 462 L-135 462 Z" fill="#150620"/>
 <path d="M-110 445 L42 445 L38 535 L-15 572 L-98 540 Z" fill="#150620"/>
 <path d="M80 445 L232 445 L222 540 L140 572 L84 535 Z" fill="#150620"/>
 <path d="M-30 625 Q70 680 160 610" stroke="#3e1a5e" stroke-width="16" fill="none" stroke-linecap="round"/>
 <path d="M160 610 L176 588" stroke="#3e1a5e" stroke-width="14" stroke-linecap="round"/>
</g>
<g id="bullet">
 <path d="M-200 -70 L60 -70 Q140 -70 190 0 Q140 70 60 70 L-200 70 Z" fill="#8a6a72"/>
 <path d="M-200 -70 L-140 -70 L-140 70 L-200 70 Z" fill="#5d444c"/>
 <path d="M-110 -70 L-85 -70 L-85 70 L-110 70 Z" fill="#6f5058"/>
 <rect x="-60" y="-48" width="170" height="24" rx="12" fill="#6b4d56"/>
 <rect x="-60" y="-12" width="170" height="24" rx="12" fill="#6b4d56"/>
 <rect x="-60" y="24" width="170" height="24" rx="12" fill="#6b4d56"/>
 <path d="M-200 -70 L60 -70 Q140 -70 190 0 Q140 70 60 70 L-200 70 Z" fill="url(#dots)"/>
</g>
</defs>

<!-- portal glow edges -->
<rect x="0" y="0" width="70" height="865" fill="url(#gL)"/>
<rect x="1030" y="0" width="70" height="865" fill="url(#gR)"/>
<ellipse cx="0" cy="500" rx="40" ry="260" fill="#b070e8" opacity="0.5" filter="url(#blur)"/>
<ellipse cx="1100" cy="500" rx="40" ry="260" fill="#b070e8" opacity="0.5" filter="url(#blur)"/>
<ellipse cx="0" cy="190" rx="30" ry="110" fill="#b070e8" opacity="0.5" filter="url(#blur)"/>
<ellipse cx="1100" cy="190" rx="30" ry="110" fill="#b070e8" opacity="0.5" filter="url(#blur)"/>

<!-- travel line and speed streaks behind the bullet (y=190) -->
<line x1="120" y1="190" x2="790" y2="190" stroke="#d9b6f5" stroke-width="5" stroke-dasharray="26 22" stroke-linecap="round" opacity="0.55"/>
<rect x="330" y="105" width="440" height="9" rx="4.5" fill="url(#trail)"/>
<rect x="470" y="150" width="300" height="9" rx="4.5" fill="url(#trail)"/>
<rect x="420" y="228" width="350" height="9" rx="4.5" fill="url(#trail)"/>
<rect x="560" y="270" width="210" height="9" rx="4.5" fill="url(#trail)"/>
<!-- streaks racing away right and the same streaks coming back in left -->
<rect x="1000" y="92" width="110" height="9" rx="4.5" fill="#d9b6f5" opacity="0.5"/>
<rect x="-10" y="92" width="60" height="9" rx="4.5" fill="#d9b6f5" opacity="0.5"/>

<!-- ball wrapping -->
<use href="#ball"/>
<use href="#ball" x="1100"/>

<!-- gun and muzzle flash (left ball only) -->
<g transform="rotate(-18 344 500)">
 <rect x="330" y="430" width="100" height="26" fill="#8f8f96"/>
 <rect x="330" y="430" width="28" height="82" fill="#8f8f96"/>
 <rect x="330" y="430" width="100" height="8" fill="#a9a9b0"/>
</g>
<g transform="translate(414,414) rotate(-18)">
 <path d="M0 0 L40 -55 L62 -22 L112 -78 L124 -12 L200 0 L124 20 L140 76 L88 38 L58 86 L46 26 Z" fill="#d4580e"/>
 <path d="M18 0 L50 -28 L66 -8 L100 -34 L108 -4 L150 0 L108 10 L98 36 L74 18 L56 42 L48 12 Z" fill="#f2b632"/>
</g>

<!-- bullet wrapping: tail leaves right edge, nose re-enters left at same y, both pointing right -->
<g transform="translate(1000,190)"><use href="#bullet"/></g>
<g transform="translate(-100,190)"><use href="#bullet"/></g>

<!-- orbs -->
<g>
 <circle cx="450" cy="640" r="26" fill="#d9b6f5" opacity="0.5" filter="url(#blur2)"/><circle cx="450" cy="640" r="13" fill="#f0e0ff"/>
 <circle cx="640" cy="720" r="20" fill="#d9b6f5" opacity="0.5" filter="url(#blur2)"/><circle cx="640" cy="720" r="9" fill="#f0e0ff"/>
 <circle cx="760" cy="500" r="14" fill="#d9b6f5" opacity="0.4" filter="url(#blur2)"/><circle cx="760" cy="500" r="6" fill="#f0e0ff"/>
 <circle cx="330" cy="760" r="8" fill="#b070e8" opacity="0.8"/>
 <circle cx="870" cy="640" r="10" fill="#b070e8" opacity="0.8"/>
</g>
</svg>
