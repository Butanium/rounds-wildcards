<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="865" viewBox="0 0 1100 865">
<defs>
<filter id="g" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
<filter id="g2" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="9"/></filter>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="6" cy="6" r="3" fill="#7a1f62" opacity="0.35"/><circle cx="17" cy="17" r="3" fill="#7a1f62" opacity="0.35"/></pattern>
<linearGradient id="fade" gradientUnits="userSpaceOnUse" x1="1060" y1="100" x2="640" y2="260"><stop offset="0" stop-color="#e86fc8" stop-opacity="1"/><stop offset="1" stop-color="#e86fc8" stop-opacity="0.9"/></linearGradient>
</defs>
<!-- outgoing shot streak to the wall -->
<path d="M1030 340 L1052 130" stroke="#e86fc8" stroke-width="8" stroke-linecap="round" stroke-dasharray="28 36" opacity="0.5"/>
<!-- return arc: leaves right, hits wall top-right, U-turns back to the hand -->
<path d="M1055 100 C 920 -40, 720 10, 640 262" fill="none" stroke="#e05cc0" stroke-width="40" opacity="0.5" filter="url(#g)"/>
<path d="M1055 100 C 920 -40, 720 10, 640 262" fill="none" stroke="url(#fade)" stroke-width="16" stroke-linecap="round"/>
<path d="M1055 100 C 920 -40, 720 10, 640 262" fill="none" stroke="#f7b0e6" stroke-width="4" stroke-linecap="round" stroke-dasharray="40 60" opacity="0.8"/>
<!-- wall-hit spark -->
<g transform="translate(1058,98) rotate(-20)">
<path d="M-8 0 L-62 -34 L-34 -4 L-74 8 L-30 16 L-52 48 L-8 22 L10 50 L14 12 L40 4 L12 -8 L18 -36Z" fill="#d4580e"/>
<path d="M-6 0 L-38 -12 L-20 2 L-42 12 L-12 12 L4 28 L8 6 L26 2 L8 -6Z" fill="#f2b632"/>
</g>
<!-- pale orbs -->
<circle cx="250" cy="150" r="12" fill="#f7d6ef" opacity="0.5"/><circle cx="130" cy="560" r="9" fill="#f7d6ef" opacity="0.4"/><circle cx="420" cy="700" r="11" fill="#f7d6ef" opacity="0.4"/>
<!-- motion streaks behind/around bullet near the hand -->
<g stroke="#f7b0e6" stroke-width="8" stroke-linecap="round" opacity="0.6">
<path d="M540 330 L475 260"/><path d="M520 400 L440 350"/><path d="M590 436 L560 520" opacity="0.5"/>
</g>
<!-- bullet on the path, nose toward the hand -->
<g transform="translate(625,290) rotate(118) scale(0.72)">
<rect x="-210" y="-60" width="140" height="120" rx="14" fill="#8a6a72"/>
<path d="M-90 -60 L20 -60 C100 -50 150 -20 160 0 C150 20 100 50 20 60 L-90 60Z" fill="#9a7a82"/>
<rect x="-95" y="-62" width="24" height="124" fill="#6b4f58"/>
<rect x="-190" y="-40" width="90" height="18" rx="9" fill="#6b4f58"/><rect x="-190" y="-10" width="90" height="18" rx="9" fill="#6b4f58"/><rect x="-190" y="20" width="90" height="18" rx="9" fill="#6b4f58"/>
</g>
<!-- character, cropped bottom-right -->
<g>
<path d="M790 640 Q 600 680 505 482" fill="none" stroke="#c43c9c" stroke-width="28" stroke-linecap="round"/>
<path d="M1020 545 Q 1100 480 1032 392" fill="none" stroke="#c43c9c" stroke-width="28" stroke-linecap="round"/>
<circle cx="935" cy="690" r="200" fill="#c43c9c"/>
<circle cx="935" cy="690" r="200" fill="url(#dots)"/>
<g transform="translate(160,190)">
<path d="M680 440 Q 710 410 745 440" fill="none" stroke="#7a1f62" stroke-width="22" stroke-linecap="round"/>
<path d="M815 440 Q 850 410 880 440" fill="none" stroke="#7a1f62" stroke-width="22" stroke-linecap="round"/>
<path d="M700 540 Q 790 600 880 520" fill="none" stroke="#7a1f62" stroke-width="22" stroke-linecap="round"/>
<path d="M880 520 L896 506" stroke="#7a1f62" stroke-width="20" stroke-linecap="round"/>
</g>
</g>
<!-- grey L gun -->
<path d="M1022 392 L1048 322 L1086 312" fill="none" stroke="#8d8d94" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
<!-- glow orb at catching hand -->
<circle cx="505" cy="480" r="34" fill="#f7b0e6" opacity="0.7" filter="url(#g2)"/><circle cx="505" cy="480" r="15" fill="#f7d6ef"/>
</svg>
